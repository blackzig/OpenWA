name: BlackZig temporary formatter

on:
  push:
    branches:
      - feature/intervalo-aleatorio-0-5min-v0.24.0

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'blackzig/OpenWA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/intervalo-aleatorio-0-5min-v0.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Prettier without postinstall scripts
        run: npm ci --ignore-scripts
      - name: Apply the repository Prettier formatting to changed files
        run: |
          npx prettier --write \
            src/modules/message/bulk-message-delay.ts \
            src/modules/message/bulk-message-delay.spec.ts \
            src/modules/message/bulk-message.service.ts \
            src/modules/message/dto/bulk-message.dto.ts \
            src/modules/message/entities/message-batch.entity.ts \
            docs/16-risk-management.md \
            docs/blackzig-intervalo-0-a-5min.md
      - name: Commit the formatting only on this feature branch
        run: |
          git add -- \
            src/modules/message/bulk-message-delay.ts \
            src/modules/message/bulk-message-delay.spec.ts \
            src/modules/message/bulk-message.service.ts \
            src/modules/message/dto/bulk-message.dto.ts \
            src/modules/message/entities/message-batch.entity.ts \
            docs/16-risk-management.md \
            docs/blackzig-intervalo-0-a-5min.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "style: format v0.24.0 customization with Prettier"
            git push origin HEAD:feature/intervalo-aleatorio-0-5min-v0.24.0
          else
            echo "No formatting changes needed."
          fi

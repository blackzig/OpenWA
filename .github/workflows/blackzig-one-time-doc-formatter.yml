name: BlackZig docs formatter (temporary)

on:
  push:
    branches:
      - feature/cliente-ewetisocial-intervalo-0-a-5min-pronto

permissions:
  contents: write

jobs:
  prettier:
    if: github.repository == 'blackzig/OpenWA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/cliente-ewetisocial-intervalo-0-a-5min-pronto
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tooling without postinstall
        run: npm ci --ignore-scripts
      - name: Format customer documentation only
        run: npx prettier --write docs/blackzig-intervalo-0-a-5min-base-e9656853.md
      - name: Commit formatting change
        run: |
          git add -- docs/blackzig-intervalo-0-a-5min-base-e9656853.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format customer delivery documentation"
            git push origin HEAD:feature/cliente-ewetisocial-intervalo-0-a-5min-pronto
          fi

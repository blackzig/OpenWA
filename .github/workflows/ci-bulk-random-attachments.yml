name: Validate random bulk attachments

on:
  push:
    branches:
      - feature/bulk-random-attachments-0250
  pull_request:
    branches:
      - feature/bulk-paced-blocks-0250
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Validate translations
        run: npm run i18n:check
      - name: Run dashboard tests
        run: npm run test:unit
      - name: TypeScript and production dashboard
        run: npm run build
      - name: Lint changed modules
        run: npx eslint src/utils/bulkPersonalization.ts src/utils/bulkPersonalization.test.ts src/components/BulkComposeOptions.tsx src/pages/MessageTester.tsx src/pages/MessageTester.test.ts

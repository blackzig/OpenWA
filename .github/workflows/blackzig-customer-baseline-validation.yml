name: BlackZig customer-base validation

on:
  push:
    branches:
      - feature/cliente-ewetisocial-intervalo-0-a-5min-pronto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API checks (customer baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked packages
        run: npm ci
      - name: Full unit suite
        run: npm test -- --runInBand
      - name: Formatting
        run: npm run format:check
      - name: TypeScript type-check (including tests)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build API
        run: npm run build
      - name: OpenAPI snapshot
        run: npm run openapi:check
      - name: SDK/dashboard contract shapes
        run: npm run check:contract-shapes

  dashboard:
    name: Dashboard checks (customer baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard locked packages
        run: cd dashboard && npm ci
      - name: Validate translations
        run: cd dashboard && npm run i18n:check
      - name: Unit tests
        run: cd dashboard && npm run test
      - name: Formatting
        run: cd dashboard && npm run format:check
      - name: Build dashboard
        run: cd dashboard && npm run build

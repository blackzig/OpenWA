name: OpenWA 0.25.0 isolated build

on:
  push:
    branches:
      - ci/openwa-v0250-build-20261020

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (without Chromium download)
        run: npm ci --include=dev --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Validate versions
        run: npm run check:versions

      - name: Build NestJS API
        run: npm run build

      - name: Build Vite dashboard
        run: npm run dashboard:build

      - name: Verify compiled output
        run: |
          test -f dist/main.js
          test -f dashboard/dist/index.html

      - name: Upload build outputs (without credentials or session data)
        uses: actions/upload-artifact@v4
        with:
          name: openwa-v0250-compiled
          path: |
            dist/
            dashboard/dist/
          if-no-files-found: error
          retention-days: 7
